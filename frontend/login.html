<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — IncidentOps-AI</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-logo">
        <div class="login-logo-icon">🚨</div>
        <h1 class="login-title">IncidentOps-AI</h1>
        <p class="login-subtitle">Sign in to your account</p>
      </div>

      <div class="login-error" id="login-error"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input
            type="text"
            class="form-input"
            id="username"
            name="username"
            autocomplete="username"
            required
            autofocus
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input
            type="password"
            class="form-input"
            id="password"
            name="password"
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%" id="login-btn">
          Sign In
        </button>
      </form>

      <p style="text-align:center;margin-top:20px;font-size:12px;color:var(--text-muted);">
        AI-powered incident investigation platform
      </p>
    </div>
  </div>

  <script src="/static/js/api.js?v=5"></script>
  <script src="/static/js/auth.js?v=5"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - IncidentOps-AI</title>
  <style>
    :root {
      --gold: #d4af37;
      --gold-bright: #f5d76e;
      --yellow: #ffd700;
      --red: #dc2626;
      --bg: #0a0a0a;
      --bg-elev: #141414;
      --border: #2a2a2a;
      --text: #f5f5f5;
      --muted: #a3a3a3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 20% 0%, #1a1408 0%, #0a0a0a 45%, #000 100%);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .signup-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .signup-card {
      width: 100%;
      max-width: 440px;
      background: linear-gradient(180deg, var(--bg-elev) 0%, #0d0d0d 100%);
      border: 1px solid var(--border);
      border-top: 2px solid var(--gold);
      border-radius: 14px;
      padding: 36px 32px;
      box-shadow:
        0 0 0 1px rgba(212,175,55,.08),
        0 20px 60px rgba(0,0,0,.7),
        0 0 80px rgba(212,175,55,.06);
    }
    .signup-logo { text-align: center; margin-bottom: 26px; }
    .signup-logo-icon {
      width: 56px; height: 56px; margin: 0 auto 14px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 14px; font-size: 28px;
      background: linear-gradient(135deg, #1a1408, #0d0a03);
      border: 1px solid var(--gold);
      box-shadow: 0 0 22px rgba(212,175,55,.28);
    }
    .signup-title {
      margin: 0 0 6px; font-size: 22px; font-weight: 700;
      color: var(--gold-bright); letter-spacing: 0.02em;
      text-shadow: 0 0 20px rgba(245,215,110,.25);
    }
    .signup-subtitle { margin: 0; color: var(--muted); font-size: 13px; }
    .signup-error {
      display: none; padding: 10px 12px; margin-bottom: 16px;
      background: rgba(220,38,38,.12); border: 1px solid rgba(239,68,68,.45);
      border-radius: 8px; color: #fca5a5; font-size: 13px;
    }
    .signup-error.visible { display: block; }
    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block; font-size: 12px; font-weight: 600;
      margin-bottom: 7px; color: var(--gold);
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .form-input {
      width: 100%; padding: 11px 13px; border-radius: 8px;
      border: 1px solid var(--border); background: #050505;
      color: var(--text); font: inherit; outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .form-input::placeholder { color: #5a5a5a; }
    .form-input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(212,175,55,.15);
    }
    .btn-primary {
      width: 100%; margin-top: 8px; padding: 12px 16px;
      border: 0; border-radius: 9px; font: inherit;
      font-weight: 700; font-size: 15px; letter-spacing: 0.02em;
      color: #1a1100; cursor: pointer;
      background: linear-gradient(135deg, var(--yellow) 0%, var(--gold-bright) 40%, var(--red) 100%);
      box-shadow:
        0 4px 18px rgba(255,215,0,.25),
        0 2px 8px rgba(220,38,38,.25);
      transition: transform .12s, box-shadow .15s, filter .15s;
    }
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-1px); filter: brightness(1.08);
      box-shadow:
        0 6px 22px rgba(255,215,0,.35),
        0 4px 12px rgba(220,38,38,.35);
    }
    .btn-primary:active:not(:disabled) { transform: translateY(0); }
    .btn-primary:disabled { opacity: .55; cursor: not-allowed; filter: grayscale(.3); }
    .signup-foot {
      text-align: center; margin-top: 18px;
      font-size: 13px; color: var(--muted);
    }
    .signup-foot a {
      color: var(--yellow); font-weight: 600; text-decoration: none;
      border-bottom: 1px solid rgba(255,215,0,.3);
    }
    .signup-foot a:hover {
      color: var(--gold-bright);
      border-bottom-color: var(--gold-bright);
    }
  </style>
  <link rel="icon" type="image/png" href="/static/img/favicon.png">
</head>
<body>
  <div class="signup-wrapper">
    <div class="signup-card">
      <div class="signup-logo" style="text-align: center; margin-bottom: 24px;">
  <img src="/static/img/logo-white.png" style="max-width: 250px; height: auto; display: block; margin: 0 auto; mix-blend-mode: screen;">
</div>

      <div class="signup-error" id="signup-error"></div>

      <form id="signup-form" autocomplete="off">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input type="text" class="form-input" id="username" name="username"
                 required minlength="3" maxlength="150" autofocus>
        </div>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input type="email" class="form-input" id="email" name="email" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" class="form-input" id="password" name="password"
                 required minlength="8" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label class="form-label" for="password_confirm">Confirm password</label>
          <input type="password" class="form-input" id="password_confirm"
                 name="password_confirm" required minlength="8" autocomplete="new-password">
        </div>
        <button type="submit" class="btn-primary" id="signup-btn">Create account</button>
      </form>

      <div class="signup-foot">
        Already have an account? <a href="/login/">Sign in</a>
      </div>
    </div>
  </div>

  <script src="/static/js/signup.js?v=2"></script>
</body>
</html>

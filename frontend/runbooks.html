<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Runbooks - IncidentOps-AI</title>
  <link rel="stylesheet" href="/static/css/styles.css?v=21">
  <link rel="icon" type="image/png" href="/static/img/favicon.png">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-logo" style="display: flex; align-items: center; gap: 10px; padding: 16px;">
  <img src="/static/img/logo-white.png" style="height: 35px; width: auto; object-fit: contain; background: transparent; border: none; box-shadow: none; mix-blend-mode: screen;">
</div>
      <nav class="sidebar-nav">
        <a href="/" class="nav-item"><span class="nav-item-icon"></span><span>Dashboard</span></a>
        <a href="/incidents/" class="nav-item"><span class="nav-item-icon"></span><span>Incidents</span></a>
        <a href="/runbooks/" class="nav-item active"><span class="nav-item-icon"></span><span>Runbooks</span></a>
        <a href="/approvals/" class="nav-item"><span class="nav-item-icon"></span><span>Approvals</span></a>
      </nav>
      <div class="sidebar-footer">
        <div id="user-info">Loading...</div>
        <button class="btn btn-ghost btn-sm" id="logout-btn" style="width:100%;margin-top:8px">Sign Out</button>
      </div>
    </aside>
    <div class="main-wrapper">
      <header class="header">
        <h1 class="header-title"> Team Runbooks</h1>
        <div class="header-actions">
          <span id="result-count" style="font-size:13px;color:var(--text-muted)"></span>
        </div>
      </header>
      <main class="main">
        <div class="card" style="margin-bottom:16px">
          <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
            <div class="form-group" style="margin:0;min-width:200px;flex:1">
              <label class="form-label" style="margin-bottom:4px">Search</label>
              <input type="text" class="form-input" id="filter-search" placeholder="Search title, content, keywords...">
            </div>
            <div class="form-group" style="margin:0;min-width:150px">
              <label class="form-label" style="margin-bottom:4px">Category</label>
              <select class="form-select" id="filter-category">
                <option value="">All categories</option>
                <option value="deployment">Deployment</option>
                <option value="resource">Resource</option>
                <option value="network">Network</option>
                <option value="database">Database</option>
                <option value="container">Container</option>
                <option value="auth">Auth</option>
                <option value="other">Other</option>
              </select>
            </div>
          </div>
        </div>
        <div id="runbooks-container">
          <div class="loading-overlay"><span class="spinner"></span> Loading runbooks...</div>
        </div>
      </main>
    </div>
  </div>
  <script src="/static/js/api.js?v=18"></script>
  <script src="/static/js/utils.js?v=18"></script>
  <script src="/static/js/runbooks.js?v=18"></script>
  <script src="/static/js/widget.js?v=26"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Incidents - IncidentOps-AI</title>
  <link rel="stylesheet" href="/static/css/styles.css?v=21">
  <link rel="icon" type="image/png" href="/static/img/favicon.png">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-logo" style="display: flex; align-items: center; gap: 10px; padding: 16px;">
  <img src="/static/img/logo-white.png" style="height: 35px; width: auto; object-fit: contain; background: transparent; border: none; box-shadow: none; mix-blend-mode: screen;">
</div>
      <nav class="sidebar-nav">
        <a href="/" class="nav-item">
          <span class="nav-item-icon"></span>
          <span>Dashboard</span>
        </a>
        <a href="/incidents/" class="nav-item active">
          <span class="nav-item-icon"></span>
          <span>Incidents</span>
        </a>
        <a href="/runbooks/" class="nav-item">
          <span class="nav-item-icon"></span>
          <span>Runbooks</span>
        </a>
        <a href="/approvals/" class="nav-item">
          <span class="nav-item-icon"></span>
          <span>Approvals</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div id="user-info">Loading...</div>
        <button class="btn btn-ghost btn-sm" id="logout-btn" style="width:100%;margin-top:8px">Sign Out</button>
      </div>
    </aside>
    <div class="main-wrapper">
      <header class="header">
        <h1 class="header-title">Incidents</h1>
        <div class="header-actions">
          <button class="btn btn-primary" id="create-incident-btn">+ Create Incident</button>
          <span id="result-count" style="font-size:13px;color:var(--text-muted)"></span>
        </div>
      </header>
      <main class="main">
        <div class="card" style="margin-bottom:16px">
          <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
            <div class="form-group" style="margin:0;min-width:180px">
              <label class="form-label" style="margin-bottom:4px">Search</label>
              <input type="text" class="form-input" id="filter-search" placeholder="Search title...">
            </div>
            <div class="form-group" style="margin:0;min-width:150px">
              <label class="form-label" style="margin-bottom:4px">Severity</label>
              <select class="form-select" id="filter-severity">
                <option value="">All</option>
                <option value="critical">Critical</option>
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
              </select>
            </div>
            <div class="form-group" style="margin:0;min-width:150px">
              <label class="form-label" style="margin-bottom:4px">Status</label>
              <select class="form-select" id="filter-status">
                <option value="">All</option>
                <option value="open">Open</option>
                <option value="investigating">Investigating</option>
                <option value="resolved">Resolved</option>
              </select>
            </div>
            <div class="form-group" style="margin:0">
              <label class="form-label" style="margin-bottom:4px">&nbsp;</label>
              <button class="btn btn-ghost" id="clear-filters">Clear</button>
            </div>
          </div>
        </div>
        <div id="incidents-container" class="incident-list">
          <div class="loading-overlay"><span class="spinner"></span> Loading incidents...</div>
        </div>
        <div id="pagination" style="display:flex;justify-content:center;gap:8px;margin-top:16px"></div>
      </main>
    </div>
  </div>
  <script src="/static/js/api.js?v=18"></script>
  <script src="/static/js/utils.js?v=18"></script>
  <script src="/static/js/incidents.js?v=18"></script>

  <!-- Create Incident Modal -->
  <div id="create-incident-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;align-items:center;justify-content:center">
    <div style="background:var(--bg-elevated);border-radius:12px;padding:24px;max-width:500px;width:90%;border:1px solid var(--border)">
      <h2 style="font-size:20px;font-weight:600;margin-bottom:16px">Create New Incident</h2>
      <div style="margin-bottom:12px">
        <label style="display:block;font-size:12px;color:var(--text-muted);margin-bottom:4px">Title</label>
        <input type="text" id="inc-title" class="form-input" placeholder="e.g. Database returning timeout errors" style="width:100%">
      </div>
      <div style="margin-bottom:12px">
        <label style="display:block;font-size:12px;color:var(--text-muted);margin-bottom:4px">Description</label>
        <textarea id="inc-description" class="form-input" placeholder="Details..." style="width:100%;min-height:60px"></textarea>
      </div>
      <div style="display:flex;gap:12px;margin-bottom:16px">
        <div style="flex:1">
          <label style="display:block;font-size:12px;color:var(--text-muted);margin-bottom:4px">Severity</label>
          <select id="inc-severity" class="form-select" style="width:100%">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
            <option value="critical">Critical</option>
          </select>
        </div>
        <div style="flex:1">
          <label style="display:block;font-size:12px;color:var(--text-muted);margin-bottom:4px">Service</label>
          <select id="inc-service" class="form-select" style="width:100%">
            <option value="">None</option>
          </select>
        </div>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn btn-ghost" id="cancel-incident">Cancel</button>
        <button class="btn btn-primary" id="submit-incident">Create + Investigate</button>
      </div>
    </div>
  </div>
  <script src="/static/js/widget.js?v=26"></script>
</body>
</html>

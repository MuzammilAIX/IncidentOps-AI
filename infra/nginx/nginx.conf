# ═══════════════════════════════════════════════════════════
# Nginx — Production config
# Serves: frontend static files + proxies Django API
# ═══════════════════════════════════════════════════════════

worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Upstream Django
    upstream django {
        server web:8000;
    }

    server {
        listen 80;
        server_name _;

        # ─── Static files (from frontend volume) ─────────
        location /static/ {
            alias /usr/share/nginx/html/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # ─── Django static files (admin, DRF) ────────────
        location /staticfiles/ {
            alias /static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # ─── API proxy ────────────────────────────────────
        location /api/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # ─── Admin proxy ──────────────────────────────────
        location /admin/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ─── WebSocket proxy (future: Live Terminal) ─────
        location /ws/ {
            proxy_pass http://django;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # ─── Health check ─────────────────────────────────
        location /health/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
            access_log off;
        }

        # ─── Frontend pages (try .html, then index) ───────
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri.html $uri/ /login.html;
        }
    }
}

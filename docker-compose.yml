services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: incidentops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5433:5432"]        # ← change 5432 to 5433 (host side only)
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports: ["6379:6379"]

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes: [".:/app"]
    ports: ["8000:8000"]
    depends_on: [db, redis]
    env_file: .env

  worker:
    build: .
    command: celery -A config worker -l info
    volumes: [".:/app"]
    depends_on: [db, redis]
    env_file: .env

volumes:
  pgdata:
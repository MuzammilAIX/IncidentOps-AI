[project]
name = "incidentops-ai"
version = "0.1.0"
description = "AI-powered incident investigation and remediation platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # ── Django & API ─────────────────────────────
    "django>=5.0,<6.0",
    "djangorestframework>=3.15,<4.0",
    "python-dotenv>=1.0,<2.0",
    # ── Database ─────────────────────────────────
    "psycopg[binary]>=3.1,<4.0",
    # ── Background jobs ──────────────────────────
    "celery>=5.3,<6.0",
    "redis>=6.4,<6.5",
    # ── AI stack ─────────────────────────────────
    "langgraph>=0.2,<0.3",
    "langchain-core>=0.3,<0.4",
    "langchain-openai>=0.2,<0.3",
    "pydantic>=2.6,<3.0",
    # ── Infrastructure connectors ────────────────
    "docker>=7.0,<8.0",
    "prometheus-api-client>=0.5,<0.6",
    # ── Production server ────────────────────────
    "gunicorn>=21.2,<22.0",
    "django-filter>=26.2",
    "openai>=1.109.1",
    "pgvector>=0.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-django>=4.8,<5.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.6,<1.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.uv]
# This project is an APPLICATION, not a library.
# So we don't build a wheel — uv runs it directly from source.
package = false

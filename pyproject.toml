[project]
name = "incidentops-ai"
version = "0.1.0"
description = "AI-powered incident investigation and remediation platform"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # ── Django & API ─────────────────────────────
    "django>=5.0,<6.0",
    "djangorestframework>=3.15,<4.0",
    "django-filter>=24.0,<26.0",
    "python-dotenv>=1.0,<2.0",

    # ── Database ─────────────────────────────────
    "psycopg[binary]>=3.1,<4.0",
    "pgvector>=0.3,<1.0",

    # ── Background jobs ──────────────────────────
    "celery>=5.3,<6.0",
    "redis>=5.0,<7.0",

    # ── AI stack ─────────────────────────────────
    "langgraph>=0.2,<0.3",
    "langchain-core>=0.3,<0.4",
    "langchain-openai>=0.2,<0.3",
    "openai>=1.50,<2.0",
    "pydantic>=2.6,<3.0",

    # ── Infrastructure connectors ────────────────
    "docker>=7.0,<8.0",
    "prometheus-api-client>=0.5,<1.0",

    # ── Production server ────────────────────────
    "gunicorn>=21.2,<22.0",
]

[project.optional-dependencies]
# Optional production extras
prod = [
    "sentry-sdk[django]>=2.0,<3.0",
]

[dependency-groups]
# Development dependencies (uv-managed, not shipped)
dev = [
    "pytest>=8.0,<9.0",
    "pytest-django>=4.8,<5.0",
    "pytest-cov>=5.0,<6.0",
    "pytest-mock>=3.12,<4.0",
    "factory-boy>=3.3,<4.0",
    "ruff>=0.6,<1.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests (fast)",
    "integration: Integration tests (DB + HTTP)",
    "ai_engine: AI engine tests (mocked GPT)",
    "security: Security tests",
    "slow: Slow tests",
]

[tool.coverage.run]
source = ["apps", "ai_engine"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__init__.py",
    "*/apps.py",
    "*/admin.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.uv]
# This project is an APPLICATION, not a library.
package = false